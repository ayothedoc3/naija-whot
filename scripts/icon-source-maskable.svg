<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="felt" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1f5d3b" />
      <stop offset="1" stop-color="#163f28" />
    </linearGradient>
  </defs>
  <!-- Full-bleed, no rounded corners or border ring: the OS applies its own
       mask shape, so content must stay within the ~80% "safe zone" and the
       background must be solid edge-to-edge. -->
  <rect width="512" height="512" fill="url(#felt)" />
  <circle cx="180" cy="330" r="42" fill="none" stroke="#e2c581" stroke-width="14" opacity="0.9" />
  <polygon points="332,290 376,366 288,366" fill="none" stroke="#e2c581" stroke-width="14" stroke-linejoin="round" opacity="0.9" />
  <text x="256" y="236" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="200" fill="#faf4e3">N</text>
</svg>
