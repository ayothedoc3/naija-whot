name: CI

on:
  push:
    branches: [main, stage]
  pull_request:
    branches: [main, stage]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  # The Supabase CLI's local dev stack (`supabase start`) always seeds these
  # exact same demo values regardless of project — they are published in
  # Supabase's own CLI source and docs, not a secret tied to any real
  # project. Using them here means integration/E2E jobs need zero repository
  # secrets and can never silently skip for lack of credentials.
  LOCAL_SUPABASE_URL: "http://127.0.0.1:54321"
  LOCAL_SUPABASE_ANON_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9.CRXP1A7WOeoJeXxjNni43kdQwgnWNReilDMblYTn_I0"
  LOCAL_SUPABASE_SERVICE_ROLE_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImV4cCI6MTk4MzgxMjk5Nn0.EGIM96RAZx35lJzdJsyH-qQwv8Hdp7fsn3W0YpN81IU"

jobs:
  # ── quality: format / lint / typecheck ───────────────────────────────────
  quality:
    name: Quality checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

  # ── unit tests ────────────────────────────────────────────────────────────
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run unit tests
        run: pnpm test
        env:
          # Stub env vars so client.ts Zod validation passes during unit tests
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          NEXT_PUBLIC_SUPABASE_URL: http://localhost:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: test-anon-key

  # ── integration tests: real RLS/RPC checks against a real local Supabase ──
  integration:
    name: Integration tests (local Supabase)
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # `supabase start` runs the real Postgres + Auth + Realtime + PostgREST
      # stack in Docker (already available on ubuntu-latest runners) and
      # applies every migration in supabase/migrations/ against a fresh
      # database, the same way local dev does. This is what makes the
      # security.integration.test.ts suite a real RLS/RPC test, not a mock.
      - name: Start local Supabase stack
        run: pnpm exec supabase start

      - name: Run integration tests
        run: pnpm test:integration
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ env.LOCAL_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ env.LOCAL_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ env.LOCAL_SUPABASE_SERVICE_ROLE_KEY }}

      - name: Stop local Supabase stack
        if: always()
        run: pnpm exec supabase stop --no-backup

  # ── next build (production bundle check) ─────────────────────────────────
  build:
    name: Next.js build
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build
        env:
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'http://localhost:54321' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'ci-placeholder-anon-key' }}
          NEXT_PUBLIC_ENABLE_DEV_FIXTURES: "false"
          NEXT_TELEMETRY_DISABLED: "1"

  # ── docker build ──────────────────────────────────────────────────────────
  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: [unit, build]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: naija-whot:ci
          build-args: |
            NEXT_PUBLIC_APP_URL=http://localhost:3000
            NEXT_PUBLIC_SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'http://localhost:54321' }}
            NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'ci-placeholder-anon-key' }}
            NEXT_PUBLIC_ENABLE_DEV_FIXTURES=false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          load: true

      - name: Verify health endpoint
        run: |
          docker run --rm -d \
            --name naija-whot-ci \
            -p 3000:3000 \
            -e SUPABASE_SERVICE_ROLE_KEY=ci-placeholder-service-role-key \
            naija-whot:ci
          # Wait for container to be healthy
          ok=""
          for i in $(seq 1 15); do
            if curl -sf http://localhost:3000/api/health; then
              echo ""
              echo "Health check passed"
              ok=1
              break
            fi
            echo "Waiting... ($i/15)"
            sleep 2
          done
          docker logs naija-whot-ci
          docker stop naija-whot-ci
          if [ -z "$ok" ]; then
            echo "ERROR: /api/health never returned 200"
            exit 1
          fi

      - name: Assert no .env files baked into image
        run: |
          docker create --name naija-whot-check naija-whot:ci
          # .env files must not exist in the image filesystem
          if docker export naija-whot-check | tar -t | grep -E '^\./?(\.env|\.env\.local|\.env\.[^e])'; then
            echo "ERROR: .env file found in Docker image"
            docker rm naija-whot-check
            exit 1
          fi
          docker rm naija-whot-check
          echo "No .env files in image — OK"

  # ── playwright e2e: real two-browser-context run against a real local ────
  # ── Supabase stack, exactly like local dev — never skipped for lack of ───
  # ── repository secrets, since none are needed.                          ──
  e2e:
    name: E2E tests
    runs-on: ubuntu-latest
    needs: [unit, build]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Start local Supabase stack
        run: pnpm exec supabase start

      - name: Run E2E tests
        run: pnpm e2e
        env:
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          NEXT_PUBLIC_SUPABASE_URL: ${{ env.LOCAL_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ env.LOCAL_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ env.LOCAL_SUPABASE_SERVICE_ROLE_KEY }}
          NEXT_PUBLIC_ENABLE_DEV_FIXTURES: "true"
          NEXT_TELEMETRY_DISABLED: "1"

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Stop local Supabase stack
        if: always()
        run: pnpm exec supabase stop --no-backup
