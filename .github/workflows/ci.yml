name: CI

on:
  push:
    branches: [main, stage]
  pull_request:
    branches: [main, stage]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "20"
  PNPM_VERSION: "9"

jobs:
  # ── quality: format / lint / typecheck ───────────────────────────────────
  quality:
    name: Quality checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

  # ── unit tests ────────────────────────────────────────────────────────────
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run unit tests
        run: pnpm test
        env:
          # Stub env vars so client.ts Zod validation passes during unit tests
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          NEXT_PUBLIC_SUPABASE_URL: http://localhost:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: test-anon-key

  # ── next build (production bundle check) ─────────────────────────────────
  build:
    name: Next.js build
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build
        env:
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'http://localhost:54321' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'ci-placeholder-anon-key' }}
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: ""
          NEXT_PUBLIC_ENABLE_DEV_FIXTURES: "false"
          NEXT_TELEMETRY_DISABLED: "1"

  # ── docker build ──────────────────────────────────────────────────────────
  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: [unit, build]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: naija-whot:ci
          build-args: |
            NEXT_PUBLIC_APP_URL=http://localhost:3000
            NEXT_PUBLIC_SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'http://localhost:54321' }}
            NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'ci-placeholder-anon-key' }}
            NEXT_PUBLIC_TURNSTILE_SITE_KEY=
            NEXT_PUBLIC_ENABLE_DEV_FIXTURES=false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          load: true

      - name: Verify health endpoint
        run: |
          docker run --rm -d \
            --name naija-whot-ci \
            -p 3000:3000 \
            -e SUPABASE_SERVICE_ROLE_KEY=ci-placeholder-service-role-key \
            naija-whot:ci
          # Wait for container to be healthy
          for i in $(seq 1 15); do
            if curl -sf http://localhost:3000/api/health; then
              echo ""
              echo "Health check passed"
              break
            fi
            echo "Waiting... ($i/15)"
            sleep 2
          done
          docker stop naija-whot-ci

      - name: Assert no .env files baked into image
        run: |
          docker create --name naija-whot-check naija-whot:ci
          # .env files must not exist in the image filesystem
          if docker export naija-whot-check | tar -t | grep -E '^\./?(\.env|\.env\.local|\.env\.[^e])'; then
            echo "ERROR: .env file found in Docker image"
            docker rm naija-whot-check
            exit 1
          fi
          docker rm naija-whot-check
          echo "No .env files in image — OK"

  # ── playwright e2e (only when Supabase secrets are available) ────────────
  e2e:
    name: E2E tests
    runs-on: ubuntu-latest
    needs: [unit, build]
    if: >
      secrets.NEXT_PUBLIC_SUPABASE_URL != '' &&
      secrets.SUPABASE_SERVICE_ROLE_KEY != ''
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Run E2E tests
        run: pnpm e2e
        env:
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NEXT_PUBLIC_ENABLE_DEV_FIXTURES: "true"
          NEXT_TELEMETRY_DISABLED: "1"

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
