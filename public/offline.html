<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline · Naija Whot</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 0.75rem;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        background: #1f5d3b;
        color: #faf4e3;
        text-align: center;
        padding: 1.5rem;
      }
      h1 {
        margin: 0;
        font-size: 1.5rem;
      }
      p {
        margin: 0;
        max-width: 24rem;
        opacity: 0.85;
        font-size: 0.95rem;
      }
      button {
        margin-top: 0.5rem;
        padding: 0.6rem 1.25rem;
        border-radius: 0.6rem;
        border: none;
        background: #c6941f;
        color: #262a24;
        font-weight: 600;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <h1>You&rsquo;re offline</h1>
    <p>
      Naija Whot needs an internet connection to create or join games. Reconnect and try again —
      any game you were in will resume automatically.
    </p>
    <button onclick="location.reload()">Try again</button>
  </body>
</html>
